apiVersion: v1
kind: PersistentVolume
metadata:
  name: asset-management-uploads-pv
  labels:
    app: asset-management
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-d-drive
  hostPath:
    # Docker Desktop for Windows (WSL2) 환경에서 D드라이브 매핑 경로입니다.
    # D:\asset-uploads 폴더와 연결됩니다.
    path: /run/desktop/mnt/host/d/asset-uploads
    type: DirectoryOrCreate

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: asset-management-uploads-pvc
  namespace: asset-management
  labels:
    app: asset-management
spec:
  # PV와 동일한 storageClassName을 지정하여 서로 바인딩되도록 합니다.
  storageClassName: local-d-drive
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
